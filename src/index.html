<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CoolHQ - The UK's Professional Air Conditioning Network</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The UK's professional air conditioning network. Hire verified, F-Gas certified AC engineers with instant fixed-price quotes - or grow your AC business with our complete toolkit.">
  <meta name="theme-color" content="#08182F">
  <!-- The UI is light-themed only. Without this, some Android/Chrome browsers auto-invert form
       fields in system dark mode and get the contrast wrong — typed text becomes unreadable. -->
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Open Graph / social preview fallback (static — crawlers that unfurl links, e.g. WhatsApp,
       iMessage, don't execute JS, so per-engineer tags set at runtime aren't visible to them).
       Individual pages (e.g. engineer profiles) additionally set dynamic tags via Angular's Meta
       service, which benefits the browser tab title and JS-rendering crawlers like Googlebot. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cool HQ">
  <meta property="og:title" content="CoolHQ - The UK's Professional Air Conditioning Network">
  <meta property="og:description" content="The UK's professional air conditioning network. Hire verified, F-Gas certified AC engineers with instant fixed-price quotes.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CoolHQ - The UK's Professional Air Conditioning Network">
  <meta name="twitter:description" content="The UK's professional air conditioning network. Hire verified, F-Gas certified AC engineers with instant fixed-price quotes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
